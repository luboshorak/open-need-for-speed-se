name: Build OpenNFS1
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore MGCB
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore OpenNFS1.sln
      - name: Build
        run: dotnet build OpenNFS1.sln --configuration Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish OpenNFS1/OpenNFS1.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=false --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: OpenNFS1-win-x64
          path: publish/
