name: Build OpenNFS1
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate verified-build PowerShell syntax
        shell: pwsh
        run: |
          $files = @('packaging/Build-Release.ps1', 'packaging/Verify-CurrentBuild.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $parseErrors | ForEach-Object { Write-Error "$file : $_" }
              exit 1
            }
          }
      - name: Restore MGCB
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore OpenNFS1.sln
      - name: Build
        run: dotnet build OpenNFS1.sln --configuration Release --no-restore
      - name: ISO importer integration smoke tests
        run: dotnet run --project tests/IsoImporterSmokeTests/IsoImporterSmokeTests.csproj --configuration Release
      - name: Race finish regression tests
        run: dotnet run --project tests/RaceGateTests/RaceGateTests.csproj --configuration Release
      - name: Tournament progression regression tests
        run: dotnet run --project tests/TournamentTests/TournamentTests.csproj --configuration Release
      - name: Vehicle collision geometry tests
        run: dotnet run --project tests/VehicleCollisionTests/VehicleCollisionTests.csproj --configuration Release
      - name: Original NFS SE race mode tests
        run: dotnet run --project tests/RaceModeTests/RaceModeTests.csproj --configuration Release
      - name: Showroom navigation regression tests
        run: dotnet run --project tests/ShowroomNavigationTests/ShowroomNavigationTests.csproj --configuration Release
      - name: Fullscreen scaling and mouse geometry tests
        run: dotnet run --project tests/DisplayPresentationTests/DisplayPresentationTests.csproj --configuration Release
      - name: Original EA QFS and player profile regression tests
        run: dotnet run --project tests/OriginalFrontendTests/OriginalFrontendTests.csproj --configuration Release
      - name: Original BNK slot 42 and audio decode regression tests
        run: dotnet run --project tests/OriginalAudioBankTests/OriginalAudioBankTests.csproj --configuration Release
      - name: Publish Windows x64
        run: dotnet publish OpenNFS1/OpenNFS1.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=false --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: OpenNFS1-win-x64
          path: publish/
